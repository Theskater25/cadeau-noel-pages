<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; form-action 'none'; base-uri 'none'">
  <meta name="theme-color" content="#101b27">
  <title>Un cadeau pour toi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
:root{color-scheme:dark;--ink:#f3eee8;--muted:#aeb8c2;--rose:#d98f89;--night:#101b27;--line:rgba(233,219,204,.17)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--night)}
body{min-height:100vh;margin:0;color:var(--ink);font-family:"DM Sans",sans-serif;background:radial-gradient(ellipse at 50% 43%,#1b2a37 0,#121f2b 42%,#0d1721 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;width:360px;height:360px;border:1px solid rgba(208,173,145,.08);border-radius:50%;pointer-events:none}
body:before{left:-260px;top:18%}body:after{right:-270px;bottom:4%;width:480px;height:480px}
.snow{position:fixed;inset:0;pointer-events:none;opacity:.48;background-image:radial-gradient(1px 1px at 10% 12%,#fff 99%,transparent),radial-gradient(2px 2px at 81% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 25% 79%,#fff 99%,transparent),radial-gradient(1px 1px at 66% 64%,#fff 99%,transparent),radial-gradient(2px 2px at 92% 88%,#fff 99%,transparent),radial-gradient(1px 1px at 47% 31%,#fff 99%,transparent);background-size:360px 320px;animation:snow 24s linear infinite}
@keyframes snow{to{background-position:0 320px}}
.page{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 20px 24px}
.topline,footer{display:flex;align-items:center;justify-content:center;gap:14px;color:#9da9b2;font-size:.67rem;font-weight:600;letter-spacing:.2em;text-align:center}
.star,footer span{color:#c4a582;font-size:.9rem}
.card{width:min(100%,660px);min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:58px 52px 38px;position:relative;border:1px solid var(--line);background:linear-gradient(145deg,rgba(28,43,55,.72),rgba(17,29,40,.6));box-shadow:0 28px 100px rgba(0,0,0,.2);margin:28px 0 25px;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;width:24px;height:24px;border-color:rgba(210,170,133,.5);border-style:solid;pointer-events:none}
.card:before{left:12px;top:12px;border-width:1px 0 0 1px}.card:after{right:12px;bottom:12px;border-width:0 1px 1px 0}
.eyebrow{display:flex;align-items:center;gap:11px;color:#c3a88d;font-size:.67rem;letter-spacing:.14em;text-transform:uppercase}
.eyebrow span{width:19px;height:1px;background:#b99173;opacity:.7}
h1{font:500 clamp(2.4rem,6vw,4.1rem)/1.13 "Playfair Display",Georgia,serif;letter-spacing:-.035em;margin:28px 0 0}
h1 em{font-weight:500;color:#dfa09a}
.rule{display:flex;align-items:center;gap:10px;color:#c6a27f;margin:24px 0 19px;font-size:.8rem}.rule i{height:1px;width:52px;background:linear-gradient(90deg,transparent,rgba(203,165,132,.6))}.rule i:last-child{transform:rotate(180deg)}
.reveal{appearance:none;border:1px solid rgba(232,183,166,.56);background:linear-gradient(110deg,#a85f62,#bd7770);color:#fff8f1;min-height:52px;min-width:222px;padding:0 21px;display:flex;align-items:center;justify-content:center;gap:17px;font:600 .91rem "DM Sans",sans-serif;letter-spacing:.025em;cursor:pointer;box-shadow:0 8px 24px rgba(157,76,79,.19);transition:transform .2s,box-shadow .2s,background .2s}
.reveal:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(157,76,79,.3);background:linear-gradient(110deg,#b56a6d,#ca827a)}.reveal:focus-visible{outline:3px solid #f1c6aa;outline-offset:4px}.button-sparkle{font-size:1.2rem;color:#ffe4c9}
.tiny-note{color:#87939c;font:italic .82rem "Playfair Display",serif;margin-top:34px}
.surprise{width:100%;margin-top:20px;animation:appear .9s both}.surprise[hidden]{display:none}
@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.bouquet-wrap{width:min(100%,350px);height:280px;margin:-4px auto -14px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.16))}
.bouquet{width:100%;height:100%;overflow:visible}.bouquet-turn{transform-origin:180px 175px;animation:turn 16s ease-in-out infinite alternate}
@keyframes turn{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.stems{stroke:#668777;stroke-width:4}.leaves{fill:#597765}.flower .petal{fill:#d88f91;stroke:#f2b6a7;stroke-width:1}.flower-b .petal,.flower-f .petal{fill:#e2b2a0;stroke:#f5d6be}.flower-c .petal,.flower-e .petal{fill:#eadac2;stroke:#f4e9d6}.flower-d .petal{fill:#bd737c;stroke:#e5a1a0}.pollen{fill:#c49058;stroke:#f0cc8f;stroke-width:2}
.wrap-back{fill:#c4a48f;opacity:.92}.wrap-front{fill:url(#paper);stroke:#f1deca;stroke-width:1.4}.wrap-fold{fill:#f1d9c0;opacity:.8}.tie,.tie-tail{fill:url(#ribbon);stroke:#efb0a0;stroke-width:1}
.note{font:500 1.28rem/1.55 "Playfair Display",Georgia,serif;color:#f2e5d9;margin:0 0 9px}.note span{font-size:.96rem;color:#c5a997}
footer{font-size:.58rem;gap:10px;letter-spacing:.17em}
@media(max-width:560px){.page{padding:27px 14px 20px}.topline{font-size:.57rem;letter-spacing:.15em;gap:10px}.card{min-height:570px;padding:45px 21px 33px;margin:24px 0 23px}.eyebrow{font-size:.59rem;letter-spacing:.11em}h1{font-size:clamp(2.25rem,10vw,3.2rem)}.tiny-note{font-size:.78rem}.bouquet-wrap{height:250px;width:min(100%,310px)}.note{font-size:1.18rem}footer{font-size:.53rem;letter-spacing:.1em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.lock-card h1 { margin-top: 18px; }

.code-form {
  width: min(100%, 280px);
  display: grid;
  gap: 12px;
  text-align: left;
}

.code-form label {
  color: #d7cec9;
  font-size: .875rem;
  font-weight: 600;
}

.code-form input {
  width: 100%;
  min-height: 50px;
  padding: 12px 14px;
  border: 1px solid #7e7880;
  border-radius: 0;
  background: #131f2a;
  color: var(--ink);
  font: inherit;
}

.code-form input:focus-visible,
.lock-again:focus-visible {
  outline: 2px solid #f1c6aa;
  outline-offset: 3px;
}

.code-form .reveal { min-width: 0; margin-top: 4px; }

.code-error {
  margin: 0;
  color: #f3aca7;
  font-size: .9rem;
  line-height: 1.4;
}

.lock-again {
  min-height: 44px;
  padding: 6px 12px;
  border: 0;
  background: transparent;
  color: #bdc6cd;
  font: 500 .875rem "DM Sans", sans-serif;
  text-decoration: underline;
  text-underline-offset: .22em;
  cursor: pointer;
}

.letter-wrap {
  width: 100%;
  margin: 18px auto 0;
}

.letter-pull {
  --pull-distance: 0px;
  width: fit-content;
  max-width: 100%;
  margin: 0 auto;
  padding: 0 18px 12px;
  display: grid;
  justify-items: center;
  color: #ead5c3;
  font-size: .875rem;
  font-weight: 600;
  list-style: none;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.letter-pull::-webkit-details-marker { display: none; }
.letter-pull:active { cursor: grabbing; }
.letter-pull:focus-visible { outline: 2px solid #f1c6aa; outline-offset: 5px; }
.letter-wrap[open] .letter-pull { cursor: pointer; touch-action: auto; }

.pull-mechanism {
  position: relative;
  width: 44px;
  height: 82px;
}

.pull-cord,
.pull-ring {
  position: absolute;
  left: 50%;
  translate: -50% 0;
}

.pull-cord {
  top: 0;
  width: 2px;
  height: calc(38px + var(--pull-distance));
  background: repeating-linear-gradient(155deg, #d9b48b 0 3px, #947257 3px 5px);
}

.pull-ring {
  top: calc(36px + var(--pull-distance));
  width: 26px;
  height: 32px;
  border: 3px solid #d9b48b;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px #866447, 0 4px 12px #070e15;
}

.pull-label { transform: translateY(var(--pull-distance)); }
.pull-close,
.letter-wrap[open] .pull-label,
.letter-wrap[open] .pull-mechanism { display: none; }
.letter-wrap[open] .pull-close { display: block; text-decoration: underline; text-underline-offset: 4px; }

.letter-paper {
  margin: 8px auto 24px;
  padding: clamp(20px, 5vw, 34px);
  max-width: 38rem;
  min-width: 0;
  border: 1px solid #e2c6aa;
  border-radius: 2px;
  background: linear-gradient(150deg, #fcf1e2, #f4e4d4);
  box-shadow: 0 12px 35px #08101863;
  color: #3c2b33;
  text-align: left;
  scroll-margin-block-start: 24px;
}

.letter-wrap[open] .letter-paper { animation: unroll .42s ease-out both; }
.letter-paper p {
  margin: 0;
  font: 500 1.16rem/1.75 "Playfair Display", Georgia, serif;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.letter-paper p + p { margin-top: 1em; }

@media (max-width: 560px) {
  .letter-paper {
    margin-inline: -12px;
    padding-inline: 16px;
  }
}

@keyframes unroll {
  from { clip-path: inset(0 0 100%); opacity: .65; }
  to { clip-path: inset(0); opacity: 1; }
}

</style>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main class="page">
    <section class="card lock-card" aria-labelledby="lock-title">
      <p class="eyebrow"><span></span> 25 décembre <span></span></p>
      <h1 id="lock-title">Un cadeau <em>pour toi.</em></h1>
      <div class="rule" aria-hidden="true"><i></i><span>✦</span><i></i></div>
      <form class="code-form" id="unlock-form">
        <label for="code">Code d’accès</label>
        <input id="code" type="password" autocomplete="off"
          autocapitalize="none" spellcheck="false" maxlength="128" required data-code-field>
        <p id="feedback" class="code-error" role="status" hidden></p>
        <button class="reveal" type="submit" disabled>Déverrouiller le cadeau</button>
      <noscript>Active JavaScript pour ouvrir le cadeau.</noscript>
      </form>
    </section>
  </main>

<script>
function installBouquet() {
"use strict";
const letter = document.querySelector("#letter-wrap");
const pull = document.querySelector("#letter-pull");
const paper = document.querySelector("#letter-paper");
const button = document.querySelector("#reveal");
const surprise = document.querySelector("#surprise");
const bouquet = document.querySelector(".bouquet-wrap");
const label = button.querySelector(".button-label");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

let drag;
let ignorePointerClick = false;

pull.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0) return;
  ignorePointerClick = false;
  if (letter.open) return;

  drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
  pull.setPointerCapture(event.pointerId);
});

pull.addEventListener("pointermove", event => {
  if (event.pointerId !== drag?.id) return;
  const distance = Math.min(54, Math.max(0, event.clientY - drag.y));
  pull.style.setProperty("--pull-distance", `${distance}px`);
});

function resetPull(event) {
  if (event.pointerId !== drag?.id) return;
  drag = undefined;
  pull.style.removeProperty("--pull-distance");
}

pull.addEventListener("pointerup", event => {
  if (event.pointerId !== drag?.id) return;
  const distance = event.clientY - drag.y;
  ignorePointerClick = Math.hypot(event.clientX - drag.x, distance) >= 12;
  resetPull(event);
  if (distance >= 36) letter.open = true;
});

pull.addEventListener("pointercancel", resetPull);
pull.addEventListener("lostpointercapture", resetPull);
pull.addEventListener("click", event => {
  if (ignorePointerClick && event.detail > 0) event.preventDefault();
  ignorePointerClick = false;
});

letter.addEventListener("toggle", () => {
  if (letter.open && paper.getBoundingClientRect().bottom > window.innerHeight) {
    paper.scrollIntoView({ behavior: reducedMotion.matches ? "instant" : "smooth", block: "start" });
  }
});

button.addEventListener("click", () => {
  const opened = button.getAttribute("aria-expanded") === "true";
  button.setAttribute("aria-expanded", String(!opened));
  surprise.hidden = opened;
  label.textContent = opened ? "Ouvrir mon cadeau" : "Refermer mon cadeau";
  if (opened) {
    letter.open = false;
  } else {
    bouquet.scrollIntoView({ behavior: reducedMotion.matches ? "instant" : "smooth", block: "nearest" });
  }
});

}
"use strict";

const form = document.querySelector("#unlock-form");
const field = document.querySelector("#code");
const feedback = document.querySelector("#feedback");
const submit = form.querySelector('button[type="submit"]');

function showFeedback(message) {
  feedback.textContent = message;
  feedback.hidden = !message;
}

function decodeBase64(value) {
  return Uint8Array.from(atob(value), character => character.charCodeAt(0));
}

async function openEnvelope(code, envelope) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: decodeBase64(envelope.salt), iterations: envelope.iterations, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"],
  );
  const bytes = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: decodeBase64(envelope.iv) }, key, decodeBase64(envelope.data),
  );
  return JSON.parse(new TextDecoder().decode(bytes));
}

function displayGift({ main, letter }) {
  const template = document.createElement("template");
  template.innerHTML = main;
  const gift = template.content.querySelector("main");
  const paper = gift.querySelector("#letter-paper");
  const paragraphs = letter.split(/\r?\n(?:[ \t]*\r?\n)+/).map(text => {
    const paragraph = document.createElement("p");
    paragraph.textContent = text;
    return paragraph;
  });
  paper.replaceChildren(...paragraphs);
  gift.querySelector(".lock-again").closest("form").addEventListener("submit", event => {
    event.preventDefault();
    window.location.reload();
  });
  field.value = "";
  document.querySelector("main").replaceWith(gift);
  installBouquet();
  gift.querySelector("#reveal").focus({ preventScroll: true });
}

if (window.crypto?.subtle) {
  submit.disabled = false;
} else {
  showFeedback("Ouvre le lien en HTTPS dans ton navigateur pour déverrouiller le cadeau.");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  if (submit.disabled) return;
  submit.disabled = true;
  showFeedback("Ouverture du cadeau…");
  try {
    const envelope = JSON.parse(document.querySelector("#envelope").textContent);
    displayGift(await openEnvelope(field.value, envelope));
  } catch (error) {
    showFeedback(error.name === "OperationError"
      ? "Ce code ne permet pas d’ouvrir le cadeau. Tu peux réessayer."
      : "Le cadeau ne peut pas être ouvert. Essaie de recharger la page.");
    field.select();
  } finally {
    submit.disabled = false;
  }
});

</script>
</body>
